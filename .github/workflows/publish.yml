name: Publish DJ Music Intelligence release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish (for example 0.6.2)
        required: true
        type: string
      source_run_id:
        description: Successful build workflow run ID from the private source repository
        required: true
        type: string
  push:
    branches:
      - main
    paths:
      - '.release-trigger.json'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release repository
        uses: actions/checkout@v4

      - name: Read release request
        id: request
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "source_run_id=${{ inputs.source_run_id }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(jq -r '.version' .release-trigger.json)" >> "$GITHUB_OUTPUT"
            echo "source_run_id=$(jq -r '.source_run_id' .release-trigger.json)" >> "$GITHUB_OUTPUT"
          fi

      - name: Download release bundle from source build
        env:
          GH_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
          VERSION: ${{ steps.request.outputs.version }}
          SOURCE_RUN_ID: ${{ steps.request.outputs.source_run_id }}
        run: |
          mkdir -p release
          gh run download "$SOURCE_RUN_ID" --repo Bmcl99/dj-music-intelligence --name "DJ-Music-Intelligence-v$VERSION-Windows" --dir release

      - name: Normalize updater asset names
        env:
          VERSION: ${{ steps.request.outputs.version }}
        run: |
          mv "release/DJ Music Intelligence Setup $VERSION.exe" "release/DJ-Music-Intelligence-Setup-$VERSION.exe"
          mv "release/DJ Music Intelligence Setup $VERSION.exe.blockmap" "release/DJ-Music-Intelligence-Setup-$VERSION.exe.blockmap"

      - name: Verify updater files
        env:
          VERSION: ${{ steps.request.outputs.version }}
        run: |
          test -f "release/DJ-Music-Intelligence-Setup-$VERSION.exe"
          test -f "release/DJ-Music-Intelligence-Setup-$VERSION.exe.blockmap"
          test -f "release/latest.yml"
          grep -F "url: DJ-Music-Intelligence-Setup-$VERSION.exe" release/latest.yml

      - name: Publish or repair GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.request.outputs.version }}
        run: |
          if gh release view "v$VERSION" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "v$VERSION" \
              "release/DJ-Music-Intelligence-Setup-$VERSION.exe" \
              "release/DJ-Music-Intelligence-Setup-$VERSION.exe.blockmap" \
              "release/latest.yml" \
              --repo "${{ github.repository }}" --clobber
          else
            gh release create "v$VERSION" \
              "release/DJ-Music-Intelligence-Setup-$VERSION.exe" \
              "release/DJ-Music-Intelligence-Setup-$VERSION.exe.blockmap" \
              "release/latest.yml" \
              --repo "${{ github.repository }}" \
              --title "DJ Music Intelligence v$VERSION" \
              --notes "DJ Music Intelligence Windows release v$VERSION" \
              --latest
          fi
