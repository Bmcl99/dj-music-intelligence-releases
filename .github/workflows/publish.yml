name: Publish DJ Music Intelligence release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish (for example 0.6.1)
        required: true
        type: string
      source_run_id:
        description: Successful build workflow run ID from the private source repository
        required: true
        type: string
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish.yml'

permissions:
  contents: write

env:
  VERSION: ${{ github.event.inputs.version || '0.6.1' }}
  SOURCE_RUN_ID: ${{ github.event.inputs.source_run_id || '34442273043' }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download release bundle from source build
        env:
          GH_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
        run: |
          mkdir -p release
          gh run download "$SOURCE_RUN_ID" --repo Bmcl99/dj-music-intelligence --name "DJ-Music-Intelligence-v$VERSION-Windows" --dir release

      - name: Normalize updater asset names
        run: |
          mv "release/DJ Music Intelligence Setup $VERSION.exe" "release/DJ-Music-Intelligence-Setup-$VERSION.exe"
          mv "release/DJ Music Intelligence Setup $VERSION.exe.blockmap" "release/DJ-Music-Intelligence-Setup-$VERSION.exe.blockmap"

      - name: Verify updater files
        run: |
          ls -lah release
          test -f "release/DJ-Music-Intelligence-Setup-$VERSION.exe"
          test -f "release/DJ-Music-Intelligence-Setup-$VERSION.exe.blockmap"
          test -f "release/latest.yml"
          grep -F "url: DJ-Music-Intelligence-Setup-$VERSION.exe" release/latest.yml

      - name: Publish or repair GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$VERSION" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release delete-asset "v$VERSION" "DJ.Music.Intelligence.Setup.$VERSION.exe" --repo "${{ github.repository }}" --yes || true
            gh release delete-asset "v$VERSION" "DJ.Music.Intelligence.Setup.$VERSION.exe.blockmap" --repo "${{ github.repository }}" --yes || true
            gh release upload "v$VERSION" \
              "release/DJ-Music-Intelligence-Setup-$VERSION.exe" \
              "release/DJ-Music-Intelligence-Setup-$VERSION.exe.blockmap" \
              "release/latest.yml" \
              --repo "${{ github.repository }}" --clobber
          else
            gh release create "v$VERSION" \
              "release/DJ-Music-Intelligence-Setup-$VERSION.exe" \
              "release/DJ-Music-Intelligence-Setup-$VERSION.exe.blockmap" \
              "release/latest.yml" \
              --repo "${{ github.repository }}" \
              --title "DJ Music Intelligence v$VERSION" \
              --notes "DJ Music Intelligence Windows release v$VERSION" \
              --latest
          fi
